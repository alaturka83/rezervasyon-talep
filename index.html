<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>Rezervasyon Sistemi</title>
    <!-- ANA EKRANA / MASAÜSTÜNE EKLE (PWA) — bkz. sayfa sonundaki kurulum betiği -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2D7D74">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Rezervasyon">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <!-- html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- Firebase (Bulut senkronizasyonu — Realtime Database + Authentication) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,800&family=Work+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap');

        :root{
            --ink:#20261F;
            --ink-soft:#5E675B;
            --paper:#F2F1E7;
            --paper-2:#E9E5D3;
            --panel:#FCFBF6;
            --line:#C7C0A4;
            --line-strong:#8F8563;
            --teal:#4FB6AC;
            --teal-dark:#2D7D74;
            --teal-tint:#DFF4F1;
            --ochre:#AE7E2B;
            --ochre-tint:#F1E3C3;
            --brick:#9E3D31;
            --brick-tint:#F3DEDA;
            --green:#3F8F5F;
            --green-tint:#DCEEDD;
        }
        *{ -webkit-tap-highlight-color: transparent; }
        html,body{ background:var(--paper); }
        body{ font-family:'Work Sans', sans-serif; color:var(--ink); overscroll-behavior-y:none; }
        .font-display{ font-family:'Fraunces', serif; }
        .font-mono{ font-family:'IBM Plex Mono', monospace; }

        .scrollbar-hide::-webkit-scrollbar{ display:none; }
        .scrollbar-hide{ -ms-overflow-style:none; scrollbar-width:none; }

        .safe-b{ padding-bottom: max(0.75rem, env(safe-area-inset-bottom)); }
        .safe-t{ padding-top: env(safe-area-inset-top); }

        table, th, td{ border-color: var(--line) !important; }
        .cell-tap:active{ background-color: var(--paper-2) !important; }

        /* Tüm düğmelere basma hissiyatı */
        button:not(:disabled){ transition: transform .1s ease, box-shadow .1s ease, opacity .1s ease; }
        button:not(:disabled):active{ transform: scale(0.95); }
        label{ transition: transform .1s ease; }
        label:active{ transform: scale(0.97); }

        /* Görüntü yakalama modu */
        .snapshot-active .no-snapshot{ display:none !important; }
        .snapshot-active .table-wrapper{
            border:3px solid var(--teal-dark) !important;
            border-radius:0 !important;
            background:var(--panel) !important;
            width:1500px !important;
            margin:0 auto !important;
            box-shadow:none !important;
            overflow:visible !important;
        }
        .snapshot-active main{
            max-width:none !important;
            width:100% !important;
            padding-left:0 !important;
            padding-right:0 !important;
            margin-top:190px !important;
            display:flex !important;
            justify-content:center !important;
        }
        /* Yakalanan görüntüde satırlar, ekrandaki daraltılmış haliyle değil,
           etkinlik metinlerinin (öğretmen + etkinlik adı) taşmadan sığacağı
           kadar ferah yükseklikte olmalı. */
        .snapshot-active tbody td{ height:5rem !important; }
        .snapshot-active thead th{ height:6rem !important; }
        /* html2canvas, sticky konumlandırılmış tablo hücreleriyle satır
           yüksekliğini bazen yanlış hesaplıyor; yakalama sırasında sticky
           kaydırma zaten gerekmediği için devre dışı bırakıyoruz. */
        .snapshot-active .sticky{ position: static !important; }

        /* ================================================================
           MOBİL STABİLİZASYON — yalnızca 767px ve altı (Tailwind'in "md"
           kırılımının altı) için geçerlidir. Masaüstü görünümüne (≥768px)
           hiçbir şekilde dokunmaz.
        ================================================================= */
        @media (max-width: 767px){
            /* iOS Safari, 16px'in altındaki alanlara dokununca sayfayı
               otomatik yakınlaştırır; bu da klavye her açıldığında
               arayüzün "zıplamasına" neden olur. Tüm form alanlarını
               16px'te sabitleyerek bunu tamamen engeller. */
            input, select, textarea{ font-size:16px !important; }

            /* Dokunma gecikmesini (~300ms) ve istenmeyen çift-dokunma
               yakınlaştırmasını kaldırır. */
            button, a, select, label{ touch-action: manipulation; }

            /* Kaydırılabilir tüm panellerde (modallar, sekme şeritleri,
               gün şeridi) akıcı/momentum kaydırma. */
            .overflow-y-auto, .overflow-x-auto{ -webkit-overflow-scrolling: touch; }

            /* Her düğme ve açılır menü için rahat, parmakla kullanılabilir
               minimum dokunma alanı. */
            button, select{ min-height:44px; }
            button.w-8.h-8, button.w-9.h-9{ width:44px !important; height:44px !important; }

            /* Boyut sınıfı olmayan, salt ikonlu küçük düğmelere (ör. bilgi
               şeridindeki kapatma düğmesi) görünümü değiştirmeden gerçek
               bir dokunma alanı kazandırır. */
            button.tap-pad{ padding:10px; margin:-10px; }

            /* Tam ekran / alt sayfa (bottom-sheet) modallar, mobil
               tarayıcının adres çubuğu yüzünden kesilmesin diye görünür
               (dinamik) viewport yüksekliğine göre boyutlanır. Desteklenmeyen
               tarayıcılarda bu satır yok sayılır ve mevcut vh değeri geçerli
               kalmaya devam eder. */
            .h-\[94vh\]{ height:94dvh !important; }
            .max-h-\[92vh\]{ max-height:92dvh !important; }

            /* Ay/yıl seçicisi ve "Toplu oluştur" mekan seçicisi, düz metin
               gibi değil açıkça dokunulabilir bir açılır menü gibi görünsün
               diye bir ok ikonu kazanır. */
            select.select-chevron-light, select.select-chevron-dark{
                -webkit-appearance:none; appearance:none;
                background-repeat:no-repeat !important;
                background-position: right 10px center !important;
                background-size:14px !important;
                padding-right:30px !important;
            }
            select.select-chevron-light{
                background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>") !important;
            }
            select.select-chevron-dark{
                background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235E675B' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>") !important;
            }

            /* Yeşil alandaki Sabah/Öğle ve hafta ok düğmeleri: genel dokunma
               alanı kuralından (min-height:44px) bilinçli olarak muaf —
               burada dikey yer kazanmak öncelikli. */
            .compact-pill-btn{ min-height:0; height:24px; }
            .compact-arrow-btn{ width:26px; height:26px; min-height:0; }

            /* Ders Saatleri (Ayarlar) mobil saat kutucukları: kutu ölçüsü
               sabit kalır, yalnızca rakamlar sığdırılır — native saat
               seçici okunu gizleyip kazanılan alanı sayılara veriyoruz
               (kutuya dokunmak yerine); dokunma yine de picker'ı açar. */
            input.compact-time-input{ text-align:center; -moz-appearance:textfield; }
            input.compact-time-input::-webkit-calendar-picker-indicator{ display:none; -webkit-appearance:none; margin:0; padding:0; width:0; }
            input.compact-time-input::-webkit-datetime-edit{ padding:0; }
            input.compact-time-input::-webkit-datetime-edit-fields-wrapper{ padding:0; }
            @media (max-width: 639px){
                input.compact-time-input{ font-size:9px; letter-spacing:-0.4px; }
            }

            /* ---- Ana sayfa: tek ekrana sığan, kaydırmasız mobil düzen ----
               Normal görüntüleme sırasında (paylaşım/yakalama modu hariç)
               üst çubuk + gün şeridi sabit, ders listesi ise kalan tüm
               yüksekliği eşit 6 parçaya bölerek doldurur; böylece bir
               günün tüm saatleri aynı anda, kaydırmadan görünür. */
            #app-shell{ display:flex; flex-direction:column; }
            #app-shell:not(.snapshot-active){ height:100dvh; min-height:0; overflow:hidden; padding-bottom: calc(3.25rem + max(0.75rem, env(safe-area-inset-bottom))) !important; }
            #app-shell:not(.snapshot-active) > header{ flex-shrink:0; }
            #app-shell:not(.snapshot-active) > main{ flex:1 1 auto; min-height:0; width:100%; display:flex; flex-direction:column; overflow:hidden; padding-top:0.5rem; padding-bottom:0.5rem; }
            #app-shell:not(.snapshot-active) > main > #printable-table-area{ flex:1 1 auto; min-height:0; display:flex; flex-direction:column; }
            #app-shell:not(.snapshot-active) > main > #printable-table-area > .mobile-schedule-view{ flex:1 1 auto; min-height:0; display:flex; flex-direction:column; }
            #app-shell:not(.snapshot-active) > main > #printable-table-area > .mobile-schedule-view > .mobile-week-grid{ flex:1 1 auto; min-height:0; }
        }

        /* Mobilde parmakla hafta değiştirirken (veya ok düğmeleriyle) ızgaranın
           kayarak-belirmesi: hangi yönden geldiği ok/kaydırma yönüne göre
           değişir, böylece haftanın değiştiği daha anlaşılır olur. */
        @keyframes weekSlideInRight{ from{ opacity:0; transform:translateX(28px); } to{ opacity:1; transform:translateX(0); } }
        @keyframes weekSlideInLeft{ from{ opacity:0; transform:translateX(-28px); } to{ opacity:1; transform:translateX(0); } }
        .week-slide-right{ animation:weekSlideInRight 0.22s ease-out; }
        .week-slide-left{ animation:weekSlideInLeft 0.22s ease-out; }
        @media (prefers-reduced-motion: reduce){
            .week-slide-right, .week-slide-left{ animation:none; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback, useRef } = React;

        // --- GÜVENLİ ICON BİLEŞENİ ---
        const Icon = ({ name, className, style }) => {
            const common = { className, style, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round" };
            switch (name) {
                case 'lock': return <svg {...common}><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>;
                case 'camera': return <svg {...common}><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"></path><circle cx="12" cy="13" r="3"></circle></svg>;
                case 'calendar': return <svg {...common}><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>;
                case 'chevron-left': return <svg {...common}><polyline points="15 18 9 12 15 6"></polyline></svg>;
                case 'chevron-right': return <svg {...common}><polyline points="9 18 15 12 9 6"></polyline></svg>;
                case 'plus': return <svg {...common}><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>;
                case 'x': return <svg {...common}><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>;
                case 'eye': return <svg {...common}><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>;
                case 'settings': return <svg {...common}><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>;
                case 'menu': return <svg {...common}><line x1="4" y1="7" x2="20" y2="7"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="17" x2="14" y2="17"></line></svg>;
                case 'log-out': return <svg {...common}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>;
                case 'log-in': return <svg {...common}><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>;
                case 'trash': return <svg {...common}><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>;
                case 'info': return <svg {...common}><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>;
                case 'search': return <svg {...common}><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>;
                case 'bell': return <svg {...common}><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>;
                case 'check': return <svg {...common}><polyline points="20 6 9 17 4 12"></polyline></svg>;
                case 'download': return <svg {...common}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>;
                case 'upload': return <svg {...common}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>;
                case 'smartphone': return <svg {...common}><rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line></svg>;
                default: return null;
            }
        };

        // ================== SABİT AYARLAR ==================
        const SISTEM_ADI = "İdare Rezervasyon Sistemi";
        const SISTEM_KISA = "İRS";
        const DEFAULT_ADMIN_PASSWORD = "130513";
        const DEFAULT_LOCATIONS = ["Konferans Salonu", "Kütüphane"];

        // Sistemin kapsadığı tarih aralığı (yalnızca hafta içi günler kullanılabilir)
        const SISTEM_BASLANGIC = new Date(2026, 8, 14);  // 14.09.2026
        const SISTEM_BITIS = new Date(2027, 5, 25);      // 25.06.2027
        SISTEM_BASLANGIC.setHours(0, 0, 0, 0);
        SISTEM_BITIS.setHours(0, 0, 0, 0);

        // 14.09.2026–25.06.2027 aralığındaki resmi tatiller (dini + milli, Diyanet takvimine göre).
        // Sadece hafta içine denk gelen günler listelenmiştir (hafta sonuna denk gelenler zaten sistemde yok).
        // Varsayılan resmi tatiller (Diyanet takvimine göre) — yönetici bunları Ayarlar > Resmi Tatiller'den
        // ekleyip kaldırabilir. block: 'TAM' (tüm gün), 'SABAH' (sadece sabah kapalı) veya 'ÖĞLE' (sadece öğlen kapalı).
        const DEFAULT_HOLIDAYS = [
            { date: "2026-10-28", name: "Cumhuriyet Bayramı Arifesi", block: "ÖĞLE" },
            { date: "2026-10-29", name: "Cumhuriyet Bayramı", block: "TAM" },
            { date: "2027-01-01", name: "Yılbaşı", block: "TAM" },
            { date: "2027-03-08", name: "Ramazan Bayramı Arifesi", block: "ÖĞLE" },
            { date: "2027-03-09", name: "Ramazan Bayramı 1. Gün", block: "TAM" },
            { date: "2027-03-10", name: "Ramazan Bayramı 2. Gün", block: "TAM" },
            { date: "2027-03-11", name: "Ramazan Bayramı 3. Gün", block: "TAM" },
            { date: "2027-04-23", name: "23 Nisan Ulusal Egemenlik ve Çocuk Bayramı", block: "TAM" },
            { date: "2027-05-17", name: "Kurban Bayramı 2. Gün", block: "TAM" },
            { date: "2027-05-18", name: "Kurban Bayramı 3. Gün", block: "TAM" },
            { date: "2027-05-19", name: "Kurban Bayramı 4. Gün · 19 Mayıs Gençlik ve Spor Bayramı", block: "TAM" },
        ];
        function getDayHolidays(holidaysList, dateStr) {
            return (holidaysList || []).filter(h => h.date === dateStr);
        }
        function pickHolidayForBlock(dayHolidays, block) {
            if (!dayHolidays || !dayHolidays.length) return null;
            return dayHolidays.find(h => h.block === 'TAM') || dayHolidays.find(h => h.block === block) || null;
        }

        const MONTHS = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];
        const GUN_ADLARI = ["PAZARTESİ", "SALI", "ÇARŞAMBA", "PERŞEMBE", "CUMA"];
        const DAY_LABELS = ["Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma"];
        const DAY_SHORT = ["Pzt", "Sal", "Çar", "Per", "Cum"];
        const GUN_ADLARI_TR = { 1: "Pazartesi", 2: "Salı", 3: "Çarşamba", 4: "Perşembe", 5: "Cuma" };

        const DEFAULT_MORNING_LESSONS = [
            { label: "1. Ders", start: "08:10", end: "08:45", block: "SABAH" },
            { label: "2. Ders", start: "08:55", end: "09:30", block: "SABAH" },
            { label: "3. Ders", start: "09:40", end: "10:15", block: "SABAH" },
            { label: "4. Ders", start: "10:25", end: "11:00", block: "SABAH" },
            { label: "5. Ders", start: "11:10", end: "11:45", block: "SABAH" },
            { label: "6. Ders", start: "11:55", end: "12:30", block: "SABAH" },
        ];
        const DEFAULT_AFTERNOON_LESSONS = [
            { label: "1. Ders", start: "13:00", end: "13:35", block: "ÖĞLE" },
            { label: "2. Ders", start: "13:45", end: "14:20", block: "ÖĞLE" },
            { label: "3. Ders", start: "14:30", end: "15:05", block: "ÖĞLE" },
            { label: "4. Ders", start: "15:15", end: "15:50", block: "ÖĞLE" },
            { label: "5. Ders", start: "16:00", end: "16:35", block: "ÖĞLE" },
            { label: "6. Ders", start: "16:45", end: "17:20", block: "ÖĞLE" },
        ];
        // Not: Sözlük eşleşmeleri (findBooking vs.) orijinal "1. DERS" etiketleriyle
        // kurulduğu için görüntülenen metin değişse de dahili karşılaştırma etiket
        // değerine göre çalışır. Etiketleri "1. Ders" olarak güncelledik; bu sadece
        // görünümü değil dahili kimliği de değiştirdiği için tutarlıdır (yeni kurulum).

        // Ay seçenekleri (yalnızca sistem aralığındaki aylar)
        const MONTH_OPTIONS = (() => {
            const opts = [];
            let y = SISTEM_BASLANGIC.getFullYear(), m = SISTEM_BASLANGIC.getMonth();
            while (y < SISTEM_BITIS.getFullYear() || (y === SISTEM_BITIS.getFullYear() && m <= SISTEM_BITIS.getMonth())) {
                opts.push({ year: y, month: m, label: `${MONTHS[m]} ${y}` });
                m++; if (m > 11) { m = 0; y++; }
            }

        function slugify(str) {
            return (str || "").toString().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                .replace(/[^a-zA-Z0-9]+/g, '-').replace(/^-+|-+$/g, '').toLowerCase() || "yer";

        function toDateStrLocal(d) {
            const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }

        function normalizeDate(d) {
            const n = new Date(d);
            n.setHours(0, 0, 0, 0);
            return n;
        }

        function isInSystemRange(d) {
            const n = normalizeDate(d);
            return n.getTime() >= SISTEM_BASLANGIC.getTime() && n.getTime() <= SISTEM_BITIS.getTime();
        }

            return `${slugify(location)}-${dateStr}-${block}-${label}`.replace(/\s+/g, '-');

            return (str || '').toLocaleUpperCase('tr-TR');

            // Mobilde ana tabloyu parmakla sağa/sola kaydırarak hafta değiştirme.
            // Yatay kaydırma dikey kaydırmayla (sayfa scroll'u) karışmasın diye
            // yalnızca yatay hareket dikey hareketten belirgin şekilde fazlaysa
            // ve belirli bir eşiği geçiyorsa hafta değiştirir.
            const touchStartRef = useRef(null);
            const handleWeekTouchStart = (e) => {
                const t = e.touches[0];
                touchStartRef.current = { x: t.clientX, y: t.clientY };
            };
            const handleWeekTouchEnd = (e) => {
                const start = touchStartRef.current;
                touchStartRef.current = null;
                if (!start) return;
                const t = e.changedTouches[0];
                const dx = t.clientX - start.x;
                const dy = t.clientY - start.y;
                if (Math.abs(dx) < 55 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
                if (dx < 0) gotoNextWeek(); else gotoPrevWeek();
            };

            const findBooking = useCallback((day, lesson) => {
                if (!day || !lesson || !lesson.block || !lesson.label) return null;
                return bookings.find(b =>
                    b.location === activeLocation && b.date === day.dateStr &&
                    b.lessonLabel === lesson.label && b.block === lesson.block
                ) || null;
            }, [bookings, activeLocation]);

            const headerDateString = useMemo(() => {
                if (!weekDays?.[0]) return "";
                const first = weekDays[0], last = weekDays[4];
                const firstDay = first.dayNumber.toString().padStart(2, '0');
                const lastDay = last.dayNumber.toString().padStart(2, '0');
                const firstMonth = MONTHS[first.monthIndex] || "";
                const lastMonth = MONTHS[last.monthIndex] || "";
                if (first.year !== last.year) {
                    return `${firstDay} ${firstMonth} ${first.year} – ${lastDay} ${lastMonth} ${last.year}`;
                }
                if (first.monthIndex !== last.monthIndex) {
                    return `${firstDay} ${firstMonth} – ${lastDay} ${lastMonth} ${last.year}`;
                }
                return `${firstDay}–${lastDay} ${firstMonth} ${last.year}`;
            }, [weekDays]);

            const handleLogin = (e) => {
                e.preventDefault();
                const pass = e.target.password.value;
                if (pass === settings.adminPassword) {
                    try { localStorage.setItem('rz_role', 'admin'); } catch (e) {}
                    setRole('admin'); setShowAuthModal(false); setAuthError(''); setShowMobileMenu(false);
                    requestNotifPermission();
                } else {
                    setAuthError('Şifre hatalı, tekrar deneyin.'); e.target.password.value = "";
                }
            };

            const handleLogout = () => {
                try { localStorage.removeItem('rz_role'); } catch (e) {}
                setEditingCell(null); setRole('teacher'); setShowAuthModal(false); setAuthError(''); setShowSettingsModal(false); setShowMobileMenu(false);
                if ('clearAppBadge' in navigator) { try { navigator.clearAppBadge(); } catch (e) {} }
            };

            const upsertBooking = (booking) => {
                commitBookings([...bookings.filter(b => b.id !== booking.id), booking]);
            };
            const removeBookingById = (id) => {
                commitBookings(bookings.filter(b => b.id !== id));
            };

            // Bir rezervasyon kaydı silinirken, o saate ait onaylanmış bir talep
            // varsa (öğretmen bu üzerinden talep göndermişti) durumunu "iptal
            // edildi" olarak işaretler — öğretmenin Taleplerim'inde bildirim çıkar.
            const iptalEtIliskiliTalep = (booking) => {
                if (!booking || !fbDbRef.current) return;
                const iliskili = taleplerListesi.find(t => t.durum === 'onaylandi' && t.location === booking.location && t.date === booking.date && t.block === booking.block && t.lessonLabel === booking.lessonLabel);
                if (!iliskili) return;
                fbDbRef.current.ref(`${RZ_TALEPLER_PATH}/${iliskili.key}`).update({ durum: 'iptal_edildi', cevapZamani: Date.now() })
                    .catch(err => console.error('Talep güncellenemedi:', err));
            };

            const handleSaveBooking = (e) => {
                e.preventDefault();
                if (!editingCell || role !== 'admin' || !editingCell.valid) return;
                const form = new FormData(e.target);
                const id = bookingDocId(activeLocation, editingCell.dateStr, editingCell.lesson.block, editingCell.lesson.label);
                upsertBooking({
                    id, location: activeLocation, date: editingCell.dateStr,
                    lessonLabel: editingCell.lesson.label, block: editingCell.lesson.block,
                    teacher: form.get('teacher'), activity: form.get('activity'), timestamp: Date.now()
                });
                setEditingCell(null);
            };

            const handleDeleteCurrentBooking = () => {
                if (!editingCell) return;
                const b = findBooking(editingCell, editingCell.lesson);
                if (!b) return;
                iptalEtIliskiliTalep(b);
                removeBookingById(b.id);
                setEditingCell(null);
            };

            const handleSaveSettings = (partial, mesaj) => {
                if (role !== 'admin') return;
                commitSettings({ ...settings, ...partial });
                if (mesaj) setToastMsg(mesaj);
            };

            const handleLogoChange = (e) => {
                const file = e.target.files && e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => handleSaveSettings({ logoDataUrl: reader.result }, 'Logo güncellendi');
                reader.readAsDataURL(file);
                e.target.value = '';
            };

            const handleAddLocation = () => {
                const name = newLocationInput.trim();
                if (!name || settings.locations.includes(name)) return;
                handleSaveSettings({ locations: [...settings.locations, name] }, 'Mekan eklendi');
                setNewLocationInput('');
            };

            const handleRemoveLocation = (loc) => {
                const remaining = settings.locations.filter(l => l !== loc);
                handleSaveSettings({ locations: remaining.length ? remaining : DEFAULT_LOCATIONS }, 'Mekan kaldırıldı');
            };

            const handleAddHoliday = () => {
                const { date, name, block, days } = newHolidayForm;
                if (!date || !name.trim()) return;
                const dayCount = Math.max(1, Math.min(60, parseInt(days, 10) || 1));
                const list = settings.holidays || [];
                // Başlangıç tarihinden itibaren "gün sayısı" kadar ardışık günü otomatik oluşturur
                // (ör. 5 günlük ara tatil için başlangıç + gün sayısı yeterli, tek tek eklemeye gerek kalmaz).
                const start = new Date(date + 'T00:00:00');
                const newEntries = [];
                for (let i = 0; i < dayCount; i++) {
                    const d = new Date(start);
                    d.setDate(d.getDate() + i);
                    newEntries.push({ date: toDateStrLocal(d), name: name.trim(), block });
                }
                const newKeys = new Set(newEntries.map(e => `${e.date}-${e.block}`));
                const filtered = list.filter(h => !newKeys.has(`${h.date}-${h.block}`));
                handleSaveSettings({ holidays: [...filtered, ...newEntries].sort((a, b) => a.date < b.date ? -1 : 1) }, dayCount > 1 ? `${dayCount} günlük tatil eklendi` : 'Tatil eklendi');
                setNewHolidayForm({ date: '', name: '', block: 'TAM', days: 1 });
            };

            const handleRemoveHoliday = (date, block) => {
                handleSaveSettings({ holidays: (settings.holidays || []).filter(h => !(h.date === date && h.block === block)) }, 'Tatil kaldırıldı');
            };

            const handleSaveLessonTimes = (blockKey, index, field, value) => {
                if (role !== 'admin') return;
                const mapKey = blockKey === 'SABAH' ? 'morning' : 'afternoon';
                const current = settings.lessonTimes?.[mapKey] || (blockKey === 'SABAH' ? DEFAULT_MORNING_LESSONS : DEFAULT_AFTERNOON_LESSONS);
                const updated = current.map((l, i) => i === index ? { ...l, [field]: value } : l);
                handleSaveSettings({
                    lessonTimes: {
                        morning: settings.lessonTimes?.morning || DEFAULT_MORNING_LESSONS,
                        afternoon: settings.lessonTimes?.afternoon || DEFAULT_AFTERNOON_LESSONS,
                        [mapKey]: updated
                    }
                });
            };

            const toggleBulkDay = (dayIdx) => {
                setBulkForm(f => ({ ...f, days: f.days.includes(dayIdx) ? f.days.filter(d => d !== dayIdx) : [...f.days, dayIdx] }));
            };
            const toggleBulkPeriod = (key) => {
                setBulkForm(f => ({ ...f, periods: f.periods.includes(key) ? f.periods.filter(p => p !== key) : [...f.periods, key] }));
            };

            const handleCreateCourse = (e) => {
                e.preventDefault();
                if (role !== 'admin') return;
                const loc = bulkForm.location || activeLocation;
                if (!loc || !bulkForm.teacher.trim() || !bulkForm.activity.trim() || !bulkForm.days.length || !bulkForm.periods.length) {
                    setBulkResult('Lütfen tüm alanları doldurup en az bir gün ve bir ders saati seçin.');
                    return;
                }
                const start = new Date(bulkForm.startDate); start.setHours(0, 0, 0, 0);
                const end = new Date(bulkForm.endDate); end.setHours(0, 0, 0, 0);
                const newOnes = [];
                let tatilAtlanan = 0;
                for (let d = new Date(Math.max(start, SISTEM_BASLANGIC)); d.getTime() <= Math.min(end, SISTEM_BITIS); d.setDate(d.getDate() + 1)) {
                    const jsDay = d.getDay(); // 1=Pzt ... 5=Cuma
                    if (!bulkForm.days.includes(jsDay)) continue;
                    if (!isInSystemRange(d)) continue;
                    const dateStr = toDateStrLocal(d);
                    const dayHolidays = getDayHolidays(settings.holidays, dateStr);
                    for (const key of bulkForm.periods) {
                        const period = ALL_PERIODS.find(p => `${p.block}-${p.label}` === key);
                        if (!period) continue;
                        if (pickHolidayForBlock(dayHolidays, period.block)) { tatilAtlanan++; continue; }
                        const id = bookingDocId(loc, dateStr, period.block, period.label);
                        newOnes.push({
                            id, location: loc, date: dateStr, lessonLabel: period.label, block: period.block,
                            teacher: bulkForm.teacher.trim(), activity: bulkForm.activity.trim(), timestamp: Date.now()
                        });
                    }
                }
                if (newOnes.length === 0) {
                    setBulkResult(tatilAtlanan > 0 ? 'Seçilen aralıktaki tüm saatler resmi tatile denk geldiği için hiçbir kayıt oluşturulmadı.' : 'Seçilen aralıkta uygun gün/saat bulunamadı.');
                    return;
                }
                const conflicts = newOnes
                    .map(nb => ({ nb, existing: bookings.find(b => b.id === nb.id) }))
                    .filter(x => x.existing);
                const commit = () => {
                    const map = new Map(bookings.map(b => [b.id, b]));
                    newOnes.forEach(nb => map.set(nb.id, nb));
                    commitBookings(Array.from(map.values()));
                    setBulkResult(`${newOnes.length} ders saati başarıyla oluşturuldu / güncellendi.${conflicts.length ? ` (${conflicts.length} çakışan kaydın üzerine yazıldı.)` : ''}${tatilAtlanan > 0 ? ` (${tatilAtlanan} saat resmi tatile denk geldiği için atlandı.)` : ''}`);
                    setConflictDialog(null);
                };
                if (conflicts.length > 0) {
                    setConflictDialog({
                        conflicts,
                        onConfirm: commit,
                        onCancel: () => {
                            setConflictDialog(null);
                            setBulkResult('İşlem iptal edildi — çakışan ders saatleri bulundu, hiçbir kayıt değiştirilmedi.');
                        }
                    });
                    return;
                }
                commit();
            };

            // Rezervasyonları "kurs" olarak grupla: aynı mekan + öğretmen + etkinlik
            const courseGroups = useMemo(() => {
                const map = new Map();
                bookings.forEach(b => {
                    const key = `${b.location}|${b.teacher}|${b.activity}`;
                    if (!map.has(key)) map.set(key, { key, location: b.location, teacher: b.teacher, activity: b.activity, sessions: [] });
                    map.get(key).sessions.push(b);
                });
                return Array.from(map.values()).map(g => {
                    const dates = g.sessions.map(s => s.date).sort();
                    return { ...g, count: g.sessions.length, minDate: dates[0], maxDate: dates[dates.length - 1] };
                }).sort((a, b) => (a.minDate < b.minDate ? -1 : 1));
            }, [bookings]);

            const handleDeleteGroup = (key) => {
                bookings.filter(b => `${b.location}|${b.teacher}|${b.activity}` === key).forEach(iptalEtIliskiliTalep);
                commitBookings(bookings.filter(b => `${b.location}|${b.teacher}|${b.activity}` !== key));
                if (editingGroupKey === key) setEditingGroupKey(null);
            };

            const handleUpdateGroup = (key, newTeacher, newActivity, newStartDate, newEndDate) => {
                const groupSessions = bookings.filter(b => `${b.location}|${b.teacher}|${b.activity}` === key);
                if (!groupSessions.length) return;
                const location = groupSessions[0].location;
                const weekdaySet = new Set(groupSessions.map(b => new Date(b.date).getDay()));
                const periodSet = new Set(groupSessions.map(b => `${b.block}|${b.lessonLabel}`));
                const start = new Date(newStartDate); start.setHours(0, 0, 0, 0);
                const end = new Date(newEndDate); end.setHours(0, 0, 0, 0);
                const newOnes = [];
                for (let d = new Date(Math.max(start, SISTEM_BASLANGIC)); d.getTime() <= Math.min(end, SISTEM_BITIS); d.setDate(d.getDate() + 1)) {
                    if (!weekdaySet.has(d.getDay())) continue;
                    if (!isInSystemRange(d)) continue;
                    const dateStr = toDateStrLocal(d);
                    const dayHolidays = getDayHolidays(settings.holidays, dateStr);
                    periodSet.forEach(pk => {
                        const [block, label] = pk.split('|');
                        if (pickHolidayForBlock(dayHolidays, block)) return;
                        const id = bookingDocId(location, dateStr, block, label);
                        newOnes.push({ id, location, date: dateStr, lessonLabel: label, block, teacher: newTeacher, activity: newActivity, timestamp: Date.now() });
                    });
                }
                const conflicts = newOnes
                    .map(nb => ({ nb, existing: bookings.find(b => b.id === nb.id && `${b.location}|${b.teacher}|${b.activity}` !== key) }))
                    .filter(x => x.existing);
                const commit = () => {
                    const filtered = bookings.filter(b => `${b.location}|${b.teacher}|${b.activity}` !== key);
                    const map = new Map(filtered.map(b => [b.id, b]));
                    newOnes.forEach(nb => map.set(nb.id, nb));
                    commitBookings(Array.from(map.values()));
                    setEditingGroupKey(null);
                    setConflictDialog(null);
                };
                if (conflicts.length > 0) {
                    setConflictDialog({
                        conflicts,
                        onConfirm: commit,
                        onCancel: () => setConflictDialog(null)
                    });
                    return;
                }
                commit();
            };

            const handleExportBackup = () => {
                const data = { settings, bookings, exportedAt: new Date().toISOString() };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `rezervasyon-yedek-${toDateStrLocal(new Date())}.json`;
                link.click();
                URL.revokeObjectURL(url);
            };

            const handleImportBackup = (e) => {
                const file = e.target.files && e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                    try {
                        const data = JSON.parse(reader.result);
                        if (!data || typeof data !== 'object') throw new Error('invalid');
                        if (window.confirm('Mevcut tüm veriler yedekteki verilerle değiştirilecek. Devam edilsin mi?')) {
                            if (data.settings && typeof data.settings === 'object') commitSettings({ ...settings, ...data.settings });
                            if (Array.isArray(data.bookings)) commitBookings(data.bookings);
                        }
                    } catch (err) {
                        alert('Geçersiz yedek dosyası.');
                    }
                };
                reader.readAsText(file);
                e.target.value = '';
            };

            const processImage = async (mode = 'share') => {
                if (isCapturing) return;
                setIsCapturing(true);
                try {
                    window.scrollTo(0, 0);
                    const target = document.getElementById('printable-table-area');
                    // Mobilde tarayıcı penceresi tablodan (1500px) çok daha dar olduğu
                    // için html2canvas varsayılan olarak yalnızca görünen dar alanı
                    // yakalıyordu (haftanın ilk günüyle kesiliyordu). windowWidth'i
                    // tablonun gerçek genişliğine eşitleyerek tüm haftayı yakalıyoruz.
                    const fullWidth = Math.max(target.scrollWidth, target.offsetWidth);
                    // html2canvas kendi iç düzen hesaplamasında (özellikle otomatik
                    // yüksekliğe sahip grid satırlarında) canlı sayfadan birkaç piksel
                    // farklı ölçüm yapabiliyor; son satırın kesilmesini önlemek için
                    // güvenlik payı ekliyoruz (fazlası sorun değil, sadece boş alan olur).
                    const fullHeight = Math.max(target.scrollHeight, target.offsetHeight) + 80;
                    const canvas = await html2canvas(target, {
                        scale: 2,
                        backgroundColor: "#FCFBF6",
                        useCORS: true,
                        width: fullWidth,
                        height: fullHeight,
                        windowWidth: fullWidth,
                        windowHeight: fullHeight,
                        scrollX: 0,
                        scrollY: 0
                    });
                    if (mode === 'download') {
                        const link = document.createElement('a');
                        link.href = canvas.toDataURL('image/png'); link.download = `Program.png`; link.click();
                    } else if (navigator.share) {
                        const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
                        await navigator.share({ files: [new File([blob], 'program.png', { type: 'image/png' })], title: 'Rezervasyon Programı' });
                    }
                } catch (e) { console.error("Image Fail", e); }
                setIsCapturing(false);
            };

            const currentBooking = editingCell ? findBooking(editingCell, editingCell.lesson) : null;
            const currentTalep = editingCell ? findTalep(editingCell, editingCell.lesson) : null;
            const openSnapshotMode = () => { window.scrollTo(0, 0); setIsSnapshotMode(true); };
            const goToday = () => setCurrentDate(new Date(SISTEM_BASLANGIC.getTime() >= Date.now() ? SISTEM_BASLANGIC : Math.min(Math.max(Date.now(), SISTEM_BASLANGIC.getTime()), SISTEM_BITIS.getTime())));

            const jumpToDate = (dateStr) => {
                if (!dateStr) return;
                const [y, m, d] = dateStr.split('-').map(Number);
                let target = new Date(y, m - 1, d);
                target.setHours(0, 0, 0, 0);
                if (target < SISTEM_BASLANGIC) target = new Date(SISTEM_BASLANGIC);
                if (target > SISTEM_BITIS) target = new Date(SISTEM_BITIS);
                setCurrentDate(target);
                setShowDateJump(false);
            };


            return (
                <div id="app-shell" className={`min-h-screen pb-24 md:pb-10 ${isSnapshotMode ? 'snapshot-active' : ''}`}>

                    {/* ============ ÜST ÇUBUK ============ */}
                    <header className="no-snapshot sticky top-0 z-40 safe-t border-b" style={{ background: 'rgba(242,241,231,0.92)', backdropFilter: 'blur(10px)', borderColor: 'var(--line)' }}>
                        <div className="max-w-[1440px] mx-auto px-3 sm:px-6 py-2.5 sm:py-3 flex items-center justify-between gap-3">
                            <div className="flex items-center gap-3 min-w-0">
                                <div className="w-11 h-11 rounded-xl flex items-center justify-center shrink-0 font-display font-bold text-xl overflow-hidden" style={{ color: 'var(--teal-dark)' }}>
                                    {settings.logoDataUrl ? <img src={settings.logoDataUrl} alt="Okul logosu" className="w-full h-full object-cover" /> : (settings.schoolName || SISTEM_KISA).charAt(0)}
                                </div>
                                <div className="min-w-0">
                                    <h1 className="font-display font-semibold text-lg sm:text-2xl leading-tight truncate" style={{ color: 'var(--ink)' }}>{settings.schoolName || SISTEM_ADI}</h1>
                                    <div className="flex items-center gap-1.5 mt-0.5 min-w-0 flex-wrap">
                                        <span className="inline-flex items-center px-1.5 py-0.5 rounded-full text-[9px] sm:text-[10px] font-bold uppercase tracking-wide shrink-0" style={{ background: role === 'admin' ? 'var(--ochre-tint)' : 'var(--teal-tint)', color: role === 'admin' ? '#7A5A1E' : 'var(--teal-dark)' }}>
                                            {role === 'admin' ? 'Yönetici' : 'Görüntüleme'}
                                        </span>
                                        <span className="text-xs sm:text-sm font-medium truncate" style={{ color: 'var(--ink-soft)' }}>
                                            {settings.schoolSubtitle}
                                        </span>
                                        {cloudStatus !== 'senkron' && (
                                            <span className="text-[10px] sm:text-xs font-semibold shrink-0" style={{ color: cloudStatus === 'hata' ? 'var(--brick)' : 'var(--ink-soft)' }} title="Bulut senkronizasyon durumu">
                                                {cloudStatus === 'hata' ? '· bulut hatası' : '· buluta bağlanıyor…'}
                                            </span>
                                        )}
                                    </div>
                                </div>
                            </div>

                            {/* Masaüstü aksiyonları */}
                            <div className="hidden md:flex items-center gap-2 shrink-0">
                                {role === 'admin' && (
                                    <button onClick={() => setShowSettingsModal(true)} className="flex items-center gap-2 px-4 py-2.5 rounded-xl text-base font-semibold border transition-colors" style={{ borderColor: 'var(--line)', color: 'var(--ink)' }}>
                                        <Icon name="settings" className="w-5 h-5" /> Ayarlar
                                    </button>
                                )}
                                <button onClick={openSnapshotMode} className="flex items-center gap-2 px-4 py-2.5 rounded-xl text-base font-semibold border transition-colors" style={{ borderColor: 'var(--line)', color: 'var(--ink)' }}>
                                    <Icon name="camera" className="w-5 h-5" /> Paylaş
                                </button>
                                <button onClick={() => role === 'admin' ? handleLogout() : setShowAuthModal(true)} className="flex items-center gap-2 px-4 py-2.5 rounded-xl text-base font-semibold text-white transition-colors" style={{ background: role === 'admin' ? 'var(--brick)' : 'var(--teal)' }}>
                                    <Icon name={role === 'admin' ? 'log-out' : 'log-in'} className="w-5 h-5" /> {role === 'admin' ? 'Çıkış yap' : 'Giriş yap'}
                                </button>
                            </div>

                            {/* Mobil: hızlı paylaş + menü */}
                            <div className="flex md:hidden items-center gap-1.5 shrink-0">
                                <button onClick={openSnapshotMode} className="w-11 h-11 rounded-xl flex items-center justify-center border" style={{ borderColor: 'var(--line)' }} aria-label="Paylaş">
                                    <Icon name="camera" className="w-5 h-5" style={{ color: 'var(--ink)' }} />
                                </button>
                                <button onClick={() => setShowMobileMenu(true)} className="w-11 h-11 rounded-xl flex items-center justify-center" style={{ background: 'var(--ink)' }} aria-label="Menü">
                                    <Icon name="menu" className="w-5 h-5 text-white" />
                                </button>
                            </div>
                        </div>

                        {/* Mekan sekmeleri */}
                        <div className="max-w-[1440px] mx-auto px-3 sm:px-6 pb-2 sm:pb-3">
                            <div className="flex gap-1.5 p-1 rounded-xl overflow-x-auto scrollbar-hide" style={{ background: 'var(--paper-2)' }}>
                                {settings.locations.map(loc => (
                                    <button key={loc} onClick={() => setActiveLocation(loc)} className="flex-none px-5 py-2.5 rounded-lg text-base font-semibold whitespace-nowrap transition-all" style={activeLocation === loc ? { background: 'var(--panel)', color: 'var(--teal-dark)', boxShadow: '0 1px 2px rgba(32,38,31,0.12)' } : { color: 'var(--ink-soft)' }}>
                                        {loc}
                                    </button>
                                ))}
                            </div>
                        </div>
                    </header>

                    {/* ============ BİLDİRİM (TOAST) ============ */}
                    {toastMsg && (
                        <div className="no-snapshot fixed top-4 left-1/2 z-[999] px-5 py-3 rounded-2xl text-white font-semibold text-sm shadow-lg" style={{ background: 'var(--ink)', transform: 'translateX(-50%)' }}>
                            {toastMsg}
                        </div>
                    )}

                                            <div>
                                                <h3 className="font-display font-semibold text-xl">Yeni kayıt</h3>
                                                <p className="text-xs font-medium mt-0.5" style={{ color: 'var(--ink-soft)' }}>{editingCell?.dateStr && `${formatDateStrDisplay(editingCell.dateStr)} ${new Date(editingCell.dateStr + 'T00:00:00').toLocaleDateString('tr-TR', { weekday: 'long' })}`}</p>
                                            </div>
                                            <button onClick={() => setEditingCell(null)} className="w-9 h-9 rounded-full flex items-center justify-center shrink-0" style={{ background: 'var(--paper-2)' }}>
                                                <Icon name="x" className="w-5 h-5" />
                                            </button>
                                        </div>
                                        <form onSubmit={handleSaveBooking} className="space-y-4">
                                            {editingCell?.holiday && (
                                                <div className="p-3 rounded-xl text-xs font-semibold" style={{ background: 'var(--brick-tint)', color: 'var(--brick)' }}>
                                                    Bu saat "{editingCell.holiday.name}" nedeniyle resmi tatildir. Yine de kayıt oluşturabilirsiniz.
                                                </div>
                                            )}
                                            {currentTalep && (
                                                <div className="p-3 rounded-xl text-xs font-semibold" style={{ background: 'var(--teal-tint)', color: 'var(--teal-dark)' }}>
                                                    <span className="font-semibold">{trUpper(currentTalep.teacher)}</span> bu saat için onay bekleyen bir talep göndermiş. Buradan doğrudan kayıt oluşturursanız, o talebi "Talepler" panelinden ayrıca reddetmeniz gerekir.
                                                </div>
                                            )}
                                            <div className="p-4 rounded-2xl flex items-center justify-between font-semibold text-white text-sm" style={{ background: 'var(--teal-dark)' }}>
                                                <span>{editingCell?.lesson?.label}</span>
                                                <span className="font-mono px-3 py-1 rounded-lg" style={{ background: 'rgba(255,255,255,0.15)' }}>{editingCell?.lesson?.start}–{editingCell?.lesson?.end}</span>
                                            </div>
                                            <div className="space-y-3">
                                                <div>
                                                    <label className="block text-xs font-semibold mb-1" style={{ color: 'var(--ink-soft)' }}>Öğretmen adı</label>
                                                    <input name="teacher" required defaultValue={currentTalep ? currentTalep.teacher : ''} placeholder="Ad Soyad" className="w-full px-4 py-3.5 rounded-2xl font-semibold text-base outline-none border-2" style={{ borderColor: 'var(--line)', background: 'var(--paper)' }} />
                                                </div>
                                                <div>
                                                    <label className="block text-xs font-semibold mb-1" style={{ color: 'var(--ink-soft)' }}>Etkinlik detayı</label>
                                                    <input name="activity" required defaultValue={currentTalep ? currentTalep.activity : ''} placeholder="Konu / Etkinlik" className="w-full px-4 py-3.5 rounded-2xl font-semibold text-base outline-none border-2" style={{ borderColor: 'var(--line)', background: 'var(--paper)' }} />
                                                </div>
                                            </div>
                                            <button type="submit" className="w-full py-4 text-white font-semibold rounded-2xl" style={{ background: 'var(--teal)' }}>Kaydı tamamla</button>
                                        </form>
                                    </div>
                                ) : currentTalep ? (
                                    <div className="text-center py-6">
                                        <div className="w-20 h-20 rounded-3xl flex items-center justify-center mx-auto mb-5" style={{ background: 'var(--teal-tint)' }}>
                                            <Icon name="bell" className="w-10 h-10" style={{ color: 'var(--teal-dark)' }} />
                                        </div>
                                        <h3 className="font-display font-semibold text-2xl">Bu saat beklemede</h3>
                                        <p className="text-sm font-medium mt-2" style={{ color: 'var(--ink-soft)' }}>
                                            <span className="font-semibold">{trUpper(currentTalep.teacher)}</span> tarafından gönderilen bir talep, yönetici onayını bekliyor. Onaylanana kadar bu saat için yeni talep gönderemezsiniz.
                                        </p>
                                        <button onClick={() => setEditingCell(null)} className="w-full mt-6 py-4 text-white font-semibold rounded-2xl" style={{ background: 'var(--ink)' }}>Kapat</button>
                                    </div>
                                ) : editingCell?.holiday ? (
                                    <div className="text-center py-6">
                                        <div className="w-20 h-20 rounded-3xl flex items-center justify-center mx-auto mb-5" style={{ background: 'var(--ochre-tint)' }}>
                                            <Icon name="calendar" className="w-10 h-10" style={{ color: 'var(--ochre)' }} />
                                        </div>
                                        <h3 className="font-display font-semibold text-2xl" style={{ color: 'var(--brick)' }}>{editingCell.holiday.name}</h3>
                                        <p className="text-sm font-medium mt-2" style={{ color: 'var(--ink-soft)' }}>Bu saatte {editingCell.holiday.block === 'TAM' ? 'tüm gün' : editingCell.holiday.block === 'SABAH' ? 'sadece sabah' : 'sadece öğle'} resmi tatil nedeniyle rezervasyon alınmıyor.</p>
                                        <button onClick={() => setEditingCell(null)} className="w-full mt-6 py-4 text-white font-semibold rounded-2xl" style={{ background: 'var(--ink)' }}>Kapat</button>
                                    </div>
                                ) : (
                                    <div>
                                        <div className="flex justify-between items-start mb-5">
                                            <div>
                                                <h3 className="font-display font-semibold text-xl">Rezervasyon Talebi</h3>
                                                <p className="text-xs font-medium mt-0.5" style={{ color: 'var(--ink-soft)' }}>{activeLocation} · {editingCell?.dateStr && `${formatDateStrDisplay(editingCell.dateStr)} ${new Date(editingCell.dateStr + 'T00:00:00').toLocaleDateString('tr-TR', { weekday: 'long' })}`}</p>
                                            </div>
                                            <button onClick={() => setEditingCell(null)} className="w-9 h-9 rounded-full flex items-center justify-center shrink-0" style={{ background: 'var(--paper-2)' }}>
                                                <Icon name="x" className="w-5 h-5" />
                                            </button>
                                        </div>
                                        <form onSubmit={(e) => { e.preventDefault(); const f = new FormData(e.target); talepGonder(f.get('teacher'), f.get('activity')); }} className="space-y-4">
                                            <div className="p-4 rounded-2xl flex items-center justify-between font-semibold text-white text-sm" style={{ background: 'var(--teal-dark)' }}>
                                                <span>{editingCell?.lesson?.label}</span>
                                                <span className="font-mono px-3 py-1 rounded-lg" style={{ background: 'rgba(255,255,255,0.15)' }}>{editingCell?.lesson?.start}–{editingCell?.lesson?.end}</span>
                                            </div>
                                            {talepGonderHata && (
                                                <div className="p-3 rounded-xl text-xs font-semibold" style={{ background: 'var(--brick-tint)', color: 'var(--brick)' }}>{talepGonderHata}</div>
                                            )}
                                            <div className="space-y-3">
                                                <div>
                                                    <label className="block text-xs font-semibold mb-1" style={{ color: 'var(--ink-soft)' }}>Ad Soyad</label>
                                                    <input name="teacher" autoFocus required defaultValue={localStorage.getItem('rz_talep_isim') || ''} placeholder="Adınız ve soyadınız" className="w-full px-5 py-4 rounded-2xl font-semibold text-lg outline-none border-2" style={{ borderColor: 'var(--line)', background: 'var(--paper)' }} />
                                                </div>
                                                <div>
                                                    <label className="block text-xs font-semibold mb-1" style={{ color: 'var(--ink-soft)' }}>Ne için kullanacaksınız? (opsiyonel)</label>
                                                    <input name="activity" placeholder="Örn: Veli toplantısı" className="w-full px-5 py-4 rounded-2xl font-semibold text-lg outline-none border-2" style={{ borderColor: 'var(--line)', background: 'var(--paper)' }} />
                                                </div>
                                            </div>
                                            <button type="submit" disabled={talepGonderiliyor} className="w-full py-4 text-white font-semibold rounded-2xl" style={{ background: 'var(--teal)' }}>{talepGonderiliyor ? 'Gönderiliyor…' : 'Talebi gönder'}</button>
                                        </form>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

<!-- =========================================================================
     ANA EKRANA / MASAÜSTÜNE EKLE — kurulum şeridi + elle kurulum kılavuzu
     • Service worker (sw.js) bu HTML dosyasıyla AYNI klasörde durmalı.
     • Chrome/Edge (Android + Windows/Mac masaüstü) "beforeinstallprompt"
       olayını destekler: bu durumda alt tarafta ince bir şerit belirir ve
       "Ekle" ile tarayıcının kendi kurulum penceresi açılır. Kapatılırsa
       14 gün boyunca tekrar çıkmaz (kalıcı olarak gizlenmez).
     • iOS Safari / masaüstü Safari / Firefox gibi bu olayı HİÇ desteklemeyen
       tarayıcılarda otomatik şerit çıkmaz; bunun yerine Ayarlar → Yedekleme
       sekmesindeki "Kısayol Ekle" düğmesi veya bu şeridin "Ekle" tuşu,
       platforma göre adım adım elle kurulum talimatları gösterir.
     • window.RezervasyonKurulumu.ac() dışarıdan (Ayarlar sayfasındaki düğme
       gibi) da çağrılabilir — tek noktadan yönetilen aynı sistemdir.
     • https dışında (ör. file:// ile açıldığında) hiçbir şey yapmaz.
     ========================================================================= -->
<script>
(function () {
  var SNOOZE_KEY = 'rezervasyon_kurulum_ertele_v1';
  var SNOOZE_GUN = 14;
  var olay = null, serit = null;

  /* --- 1. Service worker --- */
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function (e) {
        console.warn('Service worker kaydedilemedi:', e);
      });
    });
  }

  /* --- 2. Yardımcılar --- */
  function kuruluMu() {
    try {
      return window.matchMedia('(display-mode: standalone)').matches ||
             window.navigator.standalone === true;
    } catch (e) { return false; }
  }
  function erteliMi() {
    try {
      var t = parseInt(localStorage.getItem(SNOOZE_KEY) || '0', 10);
      return t ? (Date.now() - t) < SNOOZE_GUN * 86400000 : false;
    } catch (e) { return false; }
  }
  function platform() {
    var ua = navigator.userAgent || '';
    var iOS = /iPad|iPhone|iPod/.test(ua) ||
      (ua.indexOf('Macintosh') > -1 && navigator.maxTouchPoints > 1); /* iPadOS masaüstü gibi görünür */
    if (iOS) return 'ios';
    if (/Android/.test(ua)) return 'android';
    if (/Macintosh/.test(ua)) return 'mac';
    if (/Firefox/.test(ua)) return 'firefox';
    return 'windows';
  }
  /* Instagram/WhatsApp/Facebook/TikTok gibi uygulamaların İÇİNDEKİ mini
     tarayıcılarda "Ana ekrana ekle" seçeneği ya hiç yok ya da farklı bir
     yerde — bu yüzden kullanıcı "3 nokta" diye bir şey bulamıyor. Böyle
     bir ortam tespit edilirse önce gerçek tarayıcıya geçmesi söylenir. */
  function uygulamaIciTarayiciMi() {
    var ua = navigator.userAgent || '';
    return /FBAN|FBAV|FB_IAB|Instagram|Line\/|WhatsApp|Twitter|TikTok|GSA\/.*wv|; wv\)/i.test(ua);
  }
  function durumMetniGuncelle() {
    var el = document.getElementById('kisayolDurum');
    if (!el) return;
    el.textContent = kuruluMu()
      ? '✅ Bu panel şu an kısayoldan/kurulu haliyle açık.'
      : 'Tarayıcıya girmeden, telefonun ana ekranından veya bilgisayarın masaüstünden doğrudan açın.';
  }

  /* --- 3. Alt şerit --- */
  function kapatSerit() {
    if (serit) { serit.remove(); serit = null; }
  }

  function goster() {
    if (serit || kuruluMu() || erteliMi()) return;
    serit = document.createElement('div');
    serit.setAttribute('role', 'dialog');
    serit.setAttribute('aria-label', 'Uygulamayı ana ekrana veya masaüstüne ekle');
    serit.style.cssText =
      'position:fixed;left:10px;right:10px;z-index:9998;max-width:420px;margin:0 auto;' +
      'bottom:calc(72px + env(safe-area-inset-bottom,0px));' +
      'display:flex;align-items:center;gap:10px;' +
      'padding:11px 12px;border-radius:14px;' +
      'background:#2D7D74;color:#fff;' +
      'font-family:"Work Sans",system-ui,sans-serif;font-size:13px;font-weight:600;' +
      'box-shadow:0 8px 26px rgba(32,38,31,.35);';
    serit.innerHTML =
      '<img src="icon-192.png" alt="" style="width:34px;height:34px;border-radius:9px;flex:none;">' +
      '<span style="flex:1;line-height:1.35;">Rezervasyon Sistemi\'ni ana ekranınıza veya masaüstünüze ekleyin — adres çubuğu olmadan, tıpkı ayrı bir uygulama gibi açılır.</span>' +
      '<button type="button" data-ek style="flex:none;min-height:40px;padding:0 14px;border:0;border-radius:11px;background:#AE7E2B;color:#fff;font:inherit;font-weight:800;">Ekle</button>' +
      '<button type="button" data-kapat aria-label="Şimdi değil" style="flex:none;width:34px;height:40px;border:0;border-radius:11px;background:transparent;color:rgba(255,255,255,.65);font:inherit;font-size:18px;">×</button>';

    serit.querySelector('[data-ek]').onclick = function () {
      try { localStorage.setItem(SNOOZE_KEY, String(Date.now())); } catch (e) {}
      kapatSerit();
      kurulumuBaslat();
    };
    serit.querySelector('[data-kapat]').onclick = function () {
      try { localStorage.setItem(SNOOZE_KEY, String(Date.now())); } catch (e) {}
      kapatSerit();
    };
    document.body.appendChild(serit);
  }

  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    olay = e;
  });

  // Tarayici fark etmeksizin (iOS Safari, Firefox, Chrome, Android vb.) ilk
  // ziyarette serit gosterilir; beforeinstallprompt burada beklenmez cunku
  // bircogu bu olayi hic desteklemiyor. Zaten kuruluysa (standalone) veya
  // yakin zamanda kapatilmissa (erteliMi) hicbir sey gosterilmez.
  window.addEventListener('load', function () {
    setTimeout(function () {
      if (!kuruluMu() && !erteliMi()) goster();
    }, 2500);
  });

  window.addEventListener('appinstalled', function () {
    try { localStorage.removeItem(SNOOZE_KEY); } catch (e) {}
    kapatSerit();
    kapatModal();
    durumMetniGuncelle();
  });

  /* --- 4. Elle kurulum kılavuzu (modal) --- Chrome/Edge dışında (iOS
     Safari, masaüstü Safari, Firefox) beforeinstallprompt hiç ateşlenmez;
     bu yüzden platforma göre adım adım talimat gösteren bir pencere var. */
  var modal = null;

  function modalOlustur() {
    if (modal) return modal;
    modal = document.createElement('div');
    modal.style.cssText =
      'position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;' +
      'background:rgba(32,38,31,.6);backdrop-filter:blur(2px);padding:16px;';
    modal.innerHTML =
      '<div style="background:#FCFBF6;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.35);width:100%;max-width:420px;max-height:90vh;overflow:auto;font-family:\'Work Sans\',system-ui,sans-serif;">' +
        '<div style="display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid #C7C0A4;">' +
          '<div style="width:38px;height:38px;border-radius:10px;background:#2D7D74;color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none;">📲</div>' +
          '<h3 style="margin:0;font-size:1rem;font-weight:800;color:#20261F;flex:1;">Ana Ekrana / Masaüstüne Ekle</h3>' +
          '<button type="button" data-modal-kapat aria-label="Kapat" style="border:0;background:transparent;font-size:20px;line-height:1;color:#5E675B;cursor:pointer;">✕</button>' +
        '</div>' +
        '<div style="padding:16px 18px;">' +
          '<ol data-adimlar style="margin:0 0 12px;padding-left:20px;color:#20261F;font-size:.86rem;line-height:1.7;"></ol>' +
          '<div data-not style="font-size:.74rem;color:#5E675B;line-height:1.55;"></div>' +
        '</div>' +
      '</div>';
    modal.addEventListener('click', function (e) { if (e.target === modal) kapatModal(); });
    modal.querySelector('[data-modal-kapat]').onclick = kapatModal;
    document.body.appendChild(modal);
    return modal;
  }

  function kapatModal() {
    if (modal) modal.style.display = 'none';
  }

  function adimGoster() {
    var m = modalOlustur();
    var p = platform();
    var adimlar, not_;

    if (uygulamaIciTarayiciMi()) {
      adimlar =
        '<li>Bu sayfa şu an Instagram/WhatsApp/Facebook gibi bir uygulamanın <b>kendi mini tarayıcısında</b> açılmış görünüyor — bu tür ekranlarda "Ana ekrana ekle" seçeneği bulunmaz.</li>' +
        '<li>Sağ üstteki <b>⋮</b> veya <b>paylaş / üç nokta</b> simgesinden <b>"Tarayıcıda Aç"</b> ya da <b>"Open in Chrome/Safari"</b> seçeneğine dokunun.</li>' +
        '<li>Bağlantı gerçek Chrome (Android) veya Safari (iPhone) uygulamasında açıldıktan sonra bu "Kısayol Ekle" adımını orada tekrar deneyin.</li>';
      not_ = 'Sistem tarayıcısı dışında (uygulama içi mini tarayıcılarda) kısayol/PWA kurulumu desteklenmez.';
    } else if (p === 'ios') {
      adimlar =
        '<li>Ekranın altındaki <b>Paylaş</b> düğmesine dokunun (kare içinden çıkan ok).</li>' +
        '<li>Açılan listeden <b>Ana Ekrana Ekle</b> seçeneğine dokunun.</li>' +
        '<li>Sağ üstteki <b>Ekle</b> düğmesine basın — simge ana ekranınıza gelir.</li>';
      not_ = 'Bu adımlar yalnızca Safari\'de çalışır. Chrome/Instagram gibi iOS\'ta başka bir uygulama içinde açtıysanız, önce sağ üstteki paylaş simgesinden "Safari\'de Aç" seçeneğini kullanın.';
    } else if (p === 'android') {
      adimlar =
        '<li>Ekranın <b>sağ üst köşesindeki üç nokta (⋮)</b> simgesine dokunun — Samsung Internet\'te bu simge alt çubukta <b>☰ menü</b> olarak görünür.</li>' +
        '<li>Açılan menüde <b>"Ana ekrana ekle"</b>, <b>"Uygulamayı yükle"</b> veya <b>"Yükle"</b> yazan satırı bulup dokunun.</li>' +
        '<li><b>Ekle / Yükle</b> deyin — simge ana ekranınıza gelir.</li>';
      not_ = 'Bu satırı göremiyorsanız: (1) bağlantıyı WhatsApp/Instagram gibi bir uygulama yerine doğrudan Chrome\'da açtığınızdan emin olun, (2) Chrome\'u güncelleyin, (3) paneli birkaç kez ziyaret edip birkaç dakika kullandıktan sonra tekrar deneyin — Chrome bazı telefonlarda bu seçeneği hemen değil, siteyle biraz etkileşimden sonra gösterir.';
    } else if (p === 'mac') {
      adimlar =
        '<li><b>Safari</b> kullanıyorsanız: üst menüden <b>Dosya → Dock\'a Ekle</b> (macOS Sonoma ve üzeri).</li>' +
        '<li><b>Chrome / Edge</b> kullanıyorsanız: adres çubuğunun sağındaki kurulum simgesine (⊕ veya bilgisayar ikonu) tıklayın, ardından <b>Yükle</b> deyin.</li>' +
        '<li>Kurulan uygulama artık Dock\'tan veya Launchpad\'den, tarayıcı açmadan doğrudan başlatılabilir.</li>';
      not_ = 'Safari sürümü Dock\'a Ekle\'yi desteklemiyorsa Chrome veya Edge ile kurulum yapmanızı öneririz.';
    } else if (p === 'firefox') {
      adimlar =
        '<li>Firefox masaüstü sürümü uygulama kurulumunu (PWA) desteklemez.</li>' +
        '<li>Bunun yerine bu sayfayı <b>yer imlerine / araç çubuğuna</b> ekleyebilir ya da aynı bilgisayarda Chrome veya Edge ile açıp oradan kurabilirsiniz.</li>' +
        '<li>Chrome/Edge\'de: adres çubuğunun sağındaki kurulum simgesine tıklayıp <b>Yükle</b> deyin.</li>';
      not_ = 'Kurulduktan sonra uygulama, adres çubuğu olmadan ayrı bir pencerede ve masaüstü/görev çubuğu kısayoluyla açılır.';
    } else {
      adimlar =
        '<li>Adres çubuğunun sağ tarafındaki kurulum simgesine (⊕ veya bilgisayar + ok ikonu) tıklayın.</li>' +
        '<li>Görünmüyorsa tarayıcının sağ üstündeki <b>⋮</b> menüsünden <b>Uygulamayı yükle</b> / <b>Yükle</b> seçeneğini seçin.</li>' +
        '<li><b>Yükle</b> deyin — kısayol masaüstünüze ve başlat menüsüne eklenir.</li>';
      not_ = 'Kurulduktan sonra uygulama, masaüstü/başlat menüsü kısayoluyla, adres çubuğu olmadan doğrudan açılır.';
    }

    m.querySelector('[data-adimlar]').innerHTML = adimlar;
    m.querySelector('[data-not]').textContent = kuruluMu()
      ? 'Bu panel şu an zaten kısayoldan/kurulu haliyle açık görünüyor.'
      : not_;
    m.style.display = 'flex';
  }

  /* --- 5. Tek giriş noktası: hem şeritten hem Ayarlar sayfasından çağrılır --- */
  function kurulumuBaslat() {
    if (olay) {
      olay.prompt();
      olay.userChoice.then(function () { olay = null; });
      return;
    }
    adimGoster();
  }

  window.RezervasyonKurulumu = {
    ac: kurulumuBaslat,
    kuruluMu: kuruluMu
  };

  durumMetniGuncelle();
})();
</script>
